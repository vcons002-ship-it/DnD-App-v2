name: CI

# Runs the project's own pre-commit checklist (typecheck + tests + build) on
# every push and PR, so regressions are caught automatically instead of relying
# on discipline. Mirrors: npm run typecheck && npm test && npm run build.
on:
  push:
  pull_request:

# One run per ref; a newer push cancels an in-progress run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` compiles better-sqlite3 (native) — ubuntu-latest has the toolchain.
      - run: npm ci
      - name: Typecheck (server + client)
        run: npm run typecheck
      - name: Test (server Vitest)
        run: npm test
      - name: Build (client + server)
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # Runners have no GPU: WebGL is software-rendered and the suite's budgets
    # widen 4x (e2e/helpers/test.ts), so one serial run takes hours. Four
    # shards keep the wall clock near an hour and under the 6 h job limit.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The normal browser suite excludes opt-in video captures and live AI demos.
      - run: npx playwright install --with-deps chromium
      - run: npm run build:e2e -w client
      - name: Browser regressions (DM + player, real sockets) — shard ${{ matrix.shard }}/4
        run: npx playwright test -c e2e/playwright.config.ts --shard=${{ matrix.shard }}/4
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 5
